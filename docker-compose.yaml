services:
  cinema:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
      - my_media:/files/media
    depends_on:
      - db

  db:
    image: postgres:15.19-trixie
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - wait_for_db:$PGDATA

volumes:
  wait_for_db:
  my_media: